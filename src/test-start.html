<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teststart (Demo)</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <main class="container">
      <h1>Hier landet das Kind</h1>
      <p>
        <strong>Platzhalter:</strong> An dieser Stelle öffnet sich die bestehende Startseite der
        Lernplattform.
      </p>
      <dl>
        <dt>Fach</dt>
        <dd data-subject></dd>
        <dt>Token (Demo, ohne Funktion)</dt>
        <dd data-token></dd>
      </dl>
      <p><a href="index.html">Zurück zur Testübersicht</a></p>
    </main>
    <script type="module">
      import { SUBJECTS } from "./js/config.js";
      const params = new URLSearchParams(window.location.search);
      document.querySelector("[data-subject]").textContent =
        SUBJECTS[params.get("subject")]?.label ?? "unbekannt";
      document.querySelector("[data-token]").textContent = params.get("token") ?? "–";
    </script>
  </body>
</html>
